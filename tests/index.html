<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Progress: проверки</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../progress.css">
    <style>
      body { margin: 24px; color: #17212b; font: 16px/1.5 Arial, sans-serif; background: #f3f6f8; }
      h1 { font-size: 24px; }
      h2 { font-size: 18px; }
      a { color: #005bff; }
      .previews { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 32px; }
      figure { margin: 0; }
      figcaption { margin-bottom: 12px; }
      iframe { display: block; border: 0; background: white; box-shadow: 0 0 0 1px #dce3eb; }
      .pass { color: #146b37; }
      .fail { color: #b42318; }
      li { margin: 6px 0; }
    </style>
    <script src="../progress.js" defer></script>
    <script src="./progress.test.js" defer></script>
  </head>
  <body>
    <h1>Progress: проверки</h1>
    <p id="summary" role="status">Выполняются проверки…</p>
    <p><a href="../index.html">Открыть приложение</a></p>
    <div class="previews">
      <figure>
        <figcaption>Portrait · 320 × 568</figcaption>
        <iframe id="portrait" src="../index.html" width="320" height="568" title="Portrait preview"></iframe>
      </figure>
      <figure>
        <figcaption>Landscape · 568 × 320</figcaption>
        <iframe id="landscape" src="../index.html" width="568" height="320" title="Landscape preview"></iframe>
      </figure>
    </div>
    <h2>Результаты</h2>
    <ol id="results"></ol>
    <div id="fixtures" hidden></div>
  </body>
</html>
